services:
  - type: web
    name: chronotrack-backend
    env: node
    region: singapore  # closest to India
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      # Add these in Render dashboard (never commit actual values):
      # DB_URI, JWT_SECRET, BIOMETRIC_API_URL, BIOMETRIC_API_KEY, CORS_ORIGIN
